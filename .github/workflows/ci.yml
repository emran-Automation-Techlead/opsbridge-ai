name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check src tests demo
      - name: Tests
        run: python -m pytest -q
      - name: Quality gate
        env:
          PYTHONPATH: src
        run: python -m opsbridge.evaluate
      - name: Secret scan (simple patterns; fails the build on a match)
        run: |
          if grep -rEn "AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{20,}" --exclude-dir=.git --exclude-dir=.venv --exclude-dir=__pycache__ --exclude-dir=.pytest_cache .; then
            echo "possible secret found"; exit 1; fi
